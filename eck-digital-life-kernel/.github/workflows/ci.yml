name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/eck/dashboard/package-lock.json
      - working-directory: src/eck/dashboard
        run: npm ci
      - working-directory: src/eck/dashboard
        run: npm run typecheck
      - working-directory: src/eck/dashboard
        run: npm test
      - working-directory: src/eck/dashboard
        run: npm run build
      - run: git diff --exit-code -- src/eck/dashboard/modules

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src/eck
      - run: python scripts/check_architecture.py
      - run: coverage run -m pytest
      - run: coverage report

  rust-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: docker build -t eck-digital-life-kernel:test .
