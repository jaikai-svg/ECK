# ECK Digital Life Kernel v0.1 reference configuration.
# Environment variables prefixed with ECK_ override these values.
environment: development
identity: eck-local
data_dir: data
workspace_dir: workspace
export_dir: workspace/exports

bind_host: 127.0.0.1
bind_port: 8420
allow_remote_bind: false
auto_start_kernel: true

heartbeat_seconds: 5
heartbeat_event_seconds: 60
sleep_cycle_seconds: 3600
task_poll_seconds: 0.5

brain_provider: ollama
ollama_base_url: http://127.0.0.1:11434
ollama_model:
ollama_timeout_seconds: 120

network_enabled: true
system_file_mutation_enabled: false
require_approval_for_medium_risk: false
max_task_attempts: 5
max_events_page_size: 500

academic_research_timeout_seconds: 30
academic_research_max_sources: 6
academic_research_max_cycles: 3
critical_research_enabled: true
critical_research_gdelt_base_url: https://api.gdeltproject.org/api/v2/doc/doc
critical_research_bing_rss_url: https://www.bing.com/news/search
critical_research_timeout_seconds: 30
critical_research_max_sources: 8
critical_research_max_claims: 5
critical_research_max_document_chars: 50000
critical_research_snapshot_retention_days: 30
critical_research_default_timespan: 7d
critical_research_quality_window: 10
critical_research_max_inconclusive_ratio: 0.5
critical_research_near_duplicate_distance: 3

image_generation_enabled: true
image_backend: forge
image_engine_python: workspace/image_engine/.venv/Scripts/python.exe
image_engine_script: scripts/run_image_engine.py
image_model_dir: workspace/models/stable-diffusion-v1-5
image_output_dir: workspace/generated_images
video_output_dir: workspace/generated_videos
image_generation_timeout_seconds: 300
dialogue_tool_wait_seconds: 120
image_generation_steps: 36
image_generation_guidance_scale: 7.5
image_adult_content_enabled: true
image_adetailer_enabled: true
image_adetailer_model: face_yolov8s.pt
image_model_catalog_path: config/image-models.json
forge_root: workspace/forge
forge_base_url: http://127.0.0.1:7861
forge_checkpoint: realisticVisionV60B1_v60B1VAE.safetensors
forge_auto_start: true
forge_start_script: scripts/start-forge.ps1
forge_stop_script: scripts/stop-forge.ps1
forge_startup_timeout_seconds: 900
rembg_enabled: true
rembg_python: workspace/rembg/.venv/Scripts/python.exe
rembg_script: scripts/run_rembg.py
rembg_model_dir: workspace/rembg/models
rembg_model: birefnet-general
video_generation_enabled: true
video_backend: cogvideox
video_engine_python: workspace/framepack/framepack_cu126_torch26/system/python/python.exe
video_engine_script: scripts/run_framepack_engine.py
framepack_source_dir: workspace/framepack/source
cogvideo_python: workspace/cogvideo/.conda/python.exe
cogvideo_script: scripts/run_cogvideo_engine.py
cogvideo_model_dir: workspace/cogvideo/model
cogvideo_smoke_report: workspace/cogvideo/verified-runtime.json
video_generation_timeout_seconds: 14400
video_default_seconds: 3
video_generation_steps: 25
video_teacache_enabled: false
video_adult_content_enabled: true
video_min_system_ram_gb: 24
video_min_available_ram_gb: 12
cogvideo_min_system_ram_gb: 15
cogvideo_min_available_ram_gb: 2

supervisor_enabled: true
supervisor_model:
supervisor_initial_delay_seconds: 30
supervisor_review_seconds: 600
supervisor_auto_assign: true
supervisor_max_reviews_per_day: 48
supervisor_max_output_tokens: 512
supervisor_context_window: 4096
supervisor_num_gpu_layers: 12
learning_stall_minutes: 30
autonomous_curriculum_enabled: true
autonomous_curriculum_interval_seconds: 300
autonomous_curriculum_max_runs_per_day: 144
autonomous_eck_focus_percent: 70
community_source_catalog_path: config/community-sources.json

skill_worker_enabled: true
skill_worker_image: eck-skill-worker:0.1.0
skill_worker_timeout_seconds: 300
skill_worker_memory_mb: 1024
skill_dependency_install_enabled: true
skill_forge_auto_enable: true
skill_forge_max_repair_attempts: 2
autonomous_learning_percent: 90
challenge_execution_percent: 10
