# ECK Digital Life Kernel v0.1 reference configuration.
# Environment variables prefixed with ECK_ override these values.
environment: development
identity: eck-local
data_dir: data
workspace_dir: workspace
export_dir: workspace/exports
archive_root:
archive_cache_dir: workspace/archive-cache
archive_cache_max_gb: 10
archive_remove_local_after_verify: false
artifact_index_refresh_seconds: 60
library_min_cards: 24
library_min_chapters: 6
library_min_relation_coverage: 0.6
library_min_independent_source_ratio: 0.75
library_min_applied_tasks: 3
library_min_fixed_tests: 3
library_min_hidden_tests: 2
library_min_evaluation_score: 0.82

bind_host: 127.0.0.1
bind_port: 8420
allow_remote_bind: false
auto_start_kernel: true

heartbeat_seconds: 5
heartbeat_event_seconds: 60
sleep_cycle_seconds: 3600
task_poll_seconds: 0.5

brain_provider: ollama
ollama_base_url: http://127.0.0.1:11434
ollama_model:
coder_model: qwen2.5-coder:7b
ollama_auto_start: true
ollama_startup_timeout_seconds: 45
ollama_keep_alive: 5m
ollama_timeout_seconds: 120
coder_timeout_seconds: 300

network_enabled: true
system_file_mutation_enabled: false
require_approval_for_medium_risk: false
max_task_attempts: 5
task_execution_timeout_seconds: 1800
task_retry_backoff_seconds: 15
task_retry_backoff_max_seconds: 900
brain_health_cache_seconds: 15
max_events_page_size: 500
resource_monitor_enabled: true
resource_sample_seconds: 5
resource_project_scan_seconds: 1800
resource_background_min_available_ram_gb: 2
resource_background_min_disk_free_gb: 10
resource_pressure_event_seconds: 300

academic_research_timeout_seconds: 30
academic_research_max_sources: 6
academic_research_max_cycles: 3
critical_research_enabled: true
critical_research_gdelt_base_url: https://api.gdeltproject.org/api/v2/doc/doc
critical_research_bing_rss_url: https://www.bing.com/news/search
critical_research_timeout_seconds: 30
critical_research_max_sources: 8
critical_research_max_claims: 5
critical_research_max_document_chars: 50000
critical_research_snapshot_retention_days: 30
critical_research_default_timespan: 7d
critical_research_quality_window: 10
critical_research_max_inconclusive_ratio: 0.5
critical_research_near_duplicate_distance: 3

rag_enabled: true
rag_auto_download: true
rag_database_path: workspace/memory/eck-rag.sqlite3
rag_model_dir: workspace/models/rag
rag_embedding_model: BAAI/bge-m3
rag_reranker_model: BAAI/bge-reranker-large
rag_device: cpu
rag_candidate_limit: 20
rag_result_limit: 2
rag_max_source_records: 2000

image_generation_enabled: true
image_backend: forge
image_engine_python: workspace/image_engine/.venv/Scripts/python.exe
image_engine_script: scripts/run_image_engine.py
image_model_dir: workspace/models/stable-diffusion-v1-5
image_output_dir: workspace/generated_images
video_output_dir: workspace/generated_videos
image_generation_timeout_seconds: 300
dialogue_tool_wait_seconds: 120
image_generation_steps: 36
image_generation_guidance_scale: 7.5
image_adult_content_enabled: true
image_adetailer_enabled: true
image_adetailer_model: face_yolov8s.pt
image_model_catalog_path: config/image-models.json
forge_root: workspace/forge
forge_base_url: http://127.0.0.1:7861
forge_checkpoint: realisticVisionV60B1_v60B1VAE.safetensors
forge_auto_start: true
forge_start_script: scripts/start-forge.ps1
forge_stop_script: scripts/stop-forge.ps1
forge_startup_timeout_seconds: 900
forge_idle_shutdown_seconds: 180
rembg_enabled: true
rembg_python: workspace/rembg/.venv/Scripts/python.exe
rembg_script: scripts/run_rembg.py
rembg_model_dir: workspace/rembg/models
rembg_model: birefnet-general
video_generation_enabled: true
video_backend: cogvideox
video_engine_python: workspace/framepack/framepack_cu126_torch26/system/python/python.exe
video_engine_script: scripts/run_framepack_engine.py
framepack_source_dir: workspace/framepack/source
cogvideo_python: workspace/cogvideo/.conda/python.exe
cogvideo_script: scripts/run_cogvideo_engine.py
cogvideo_model_dir: workspace/cogvideo/model
cogvideo_smoke_report: workspace/cogvideo/verified-runtime.json
video_generation_timeout_seconds: 14400
video_default_seconds: 5
video_generation_steps: 25
video_teacache_enabled: false
video_adult_content_enabled: true
video_min_system_ram_gb: 24
video_min_available_ram_gb: 12
cogvideo_min_system_ram_gb: 15
cogvideo_min_available_ram_gb: 2

supervisor_enabled: true
supervisor_model:
supervisor_initial_delay_seconds: 30
supervisor_review_seconds: 600
supervisor_auto_assign: true
supervisor_max_reviews_per_day: 0
supervisor_max_output_tokens: 512
supervisor_context_window: 4096
supervisor_num_gpu_layers: 12
learning_stall_minutes: 30
autonomous_curriculum_enabled: true
autonomous_curriculum_interval_seconds: 300
autonomous_curriculum_max_runs_per_day: 0
autonomous_eck_focus_percent: 70
p5_self_development_percent: 50
p5_ai_research_percent: 30
p5_foundation_percent: 15
p5_exploration_percent: 5
community_source_catalog_path: config/community-sources.json

skill_worker_enabled: true
skill_worker_image: eck-skill-worker:0.1.0
skill_worker_timeout_seconds: 300
skill_worker_memory_mb: 1024
skill_dependency_install_enabled: true
skill_forge_auto_enable: true
skill_forge_max_repair_attempts: 2
skill_canary_replays: 2
skill_canary_delay_seconds: 1
autonomous_learning_percent: 90
challenge_execution_percent: 10

repository_self_model_enabled: true
research_skill_bridge_enabled: true
research_skill_bridge_initial_delay_seconds: 600
research_skill_bridge_interval_seconds: 1800
research_skill_bridge_min_research_runs: 6
tool_campaign_enabled: true
tool_campaign_initial_delay_seconds: 3600
tool_campaign_interval_seconds: 21600
tool_campaign_target_count: 100
tool_campaign_min_stars: 500
tool_campaign_auto_publish: true
tool_campaign_workspace_dir: workspace/projects/eck-agent-toolkit
core_evolution_enabled: true
core_evolution_timeout_seconds: 900
autonomous_project_lab_enabled: true
autonomous_project_initial_delay_seconds: 1800
autonomous_project_interval_seconds: 86400
autonomous_project_min_research_runs: 4
autonomous_project_max_per_day: 1
autonomous_project_draft_attempts: 3
durable_mission_executor_enabled: true
mission_internal_review_rounds: 3
mission_deliberation_max_rounds: 5
mission_quality_min_score: 82
mission_reference_search_limit: 5
mission_workspace_max_mb: 256
mission_workspace_total_max_gb: 5
mission_retention_days: 30
mission_publish_verified_projects: true
# Set this to a NAS directory after it is mounted. Empty keeps completed artifacts local.
mission_archive_dir:
federation_enabled: true
federation_max_pack_mb: 64
federation_min_reproductions: 2
federation_registry_min_reviews: 2
federation_registry_min_trust_score: 85
federation_synthesis_min_packs: 4
federation_synthesis_min_types: 3
federation_cosign_enabled: true
# Configure a local key pair for unattended signing. Never place the private key in a Pack.
federation_cosign_executable: workspace/tools/cosign/cosign.exe
federation_cosign_key_path:
federation_cosign_public_key_path:
federation_cosign_certificate_identity:
federation_cosign_oidc_issuer:
github_publish_enabled: true
github_auto_publish_verified_projects: true
github_account:
github_default_visibility: private
